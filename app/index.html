<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta

      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="robots" content="noindex" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="../icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="The Haus" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../fonts/bdsans-bold.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../fonts/inter-latin-var.woff2"
      crossorigin
    />

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="app-body">

      <symbol id="i-plus" viewBox="0 0 448 512"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/></symbol>

      <symbol id="i-calendar" viewBox="0 0 448 512"><path d="M128 0c17.7 0 32 14.3 32 32V64H288V32c0-17.7 14.3-32 32-32s32 14.3 32 32V64h48c26.5 0 48 21.5 48 48v48H0V112C0 85.5 21.5 64 48 64H96V32c0-17.7 14.3-32 32-32zM0 192H448V464c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V192z"/></symbol>

    <header class="app-cabecera">
      <a href="../" class="app-logo">
        <span class="logo-main">the haus</span>
        <span class="logo-sub">Reservar</span>
      </a>
      <button class="app-tab" id="btnReservas" type="button">
        Mis reservas <span class="app-contador" id="contadorReservas" hidden>0</span>
      </button>
    </header>

    <div class="app-filtros">
      <div class="filtro-dias" id="filtroDias" role="tablist" aria-label="Elegir día"></div>
      <div class="filtro-franjas" id="filtroFranjas" role="tablist" aria-label="Elegir franja"></div>
    </div>

    <main class="app-lienzo" id="lienzo">
      <div class="app-capa" id="capaMapa"></div>

      <div class="app-controles">
        <button type="button" id="btnAcercar" aria-label="Acercar">
          <svg class="ico" aria-hidden="true"><use href="#i-plus" /></svg>
        </button>
        <button type="button" id="btnAlejar" aria-label="Alejar">
          <svg class="ico" aria-hidden="true"><use href="#i-minus" /></svg>
        </button>
        <button type="button" id="btnEncajar" aria-label="Encajar plano">
          <svg class="ico" aria-hidden="true"><use href="#i-expand" /></svg>
        </button>
      </div>

      <div class="app-resumen" id="resumen" aria-live="polite"></div>
    </main>

    <div class="hoja" id="hoja" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="hoja-velo"></div>
      <div class="hoja-panel" tabindex="-1">
        <div class="hoja-tirador" aria-hidden="true"></div>
        <div class="hoja-cabecera">
          <button class="hoja-cerrar" type="button" aria-label="Cerrar">
            <svg class="ico" aria-hidden="true"><use href="#i-xmark" /></svg>
          </button>
        </div>
        <div class="hoja-cuerpo" id="hojaCuerpo"></div>
      </div>
    </div>

    <div class="app-aviso" id="aviso" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
